name: EthriaAddons
version: '${project.version}'
main: de.ethria.main.Main
api-version: '26.2'
authors: [DarkPlugins]
description: Just some Addons for Ethria
depend:
  - Vault
permissions:
  system.ethria.eventchestsadmin:
    description: Berechtigt zur Verwaltung der EventChests
    default: op
  system.ethria.locatebiome:
    description: Berechtigt zur Nutzung von /locatebiome
    default: true
  system.ethria.holopanel:
    description: Berechtigt zur Nutzung von /holopanel
    default: op
commands:
  eventchests:
    description: Verwaltet und öffnet EventChests
    permission: system.ethria.eventchestsadmin
  locatebiome:
    description: Findet das nächste Biom des angegebenen Typs
    permission: system.ethria.locatebiome
  holopanel:
    description: Sendet eine Nachricht im MiniMessage-Format
    permission: system.ethria.holopanel
