name: EthriaAddons
version: '${project.version}'
main: de.ethria.main.Main
api-version: '26.2'
authors: [DarkPlugins, Leahcimkrob]
description: Just some Addons for Ethria
depend:
  - Vault
  - LuckPerms
softdepend:
  - CMI
  - DecentHolograms
  - HeadDatabase
libraries:
  - com.mysql:mysql-connector-j:9.7.0
permissions:
  ethriaaddons.admin:
    description: Zugriff auf alle EthriaAddons-Befehle einschließlich Reload
    default: op
    children:
      ethriaaddons.command.*: true
  ethriaaddons.command.*:
    description: Zugriff auf alle EthriaAddons-Befehle und Unterbefehle
    default: false
    children:
      ethriaaddons.command.ethriaaddon.*: true
      ethriaaddons.command.locatebiome.*: true
      ethriaaddons.command.holopanel.*: true
      ethriaaddons.command.dragoneggcutter.*: true
  ethriaaddons.command.automessage.*:
    default: op
    children:
      ethriaaddons.command.automessage.create: true
      ethriaaddons.command.automessage.editor: true
      ethriaaddons.command.automessage.view: true
      ethriaaddons.command.automessage.reload: true
      ethriaaddons.command.automessage.delete: true
      ethriaaddons.command.automessage.config: true
      ethriaaddons.command.automessage.debug: true
  ethriaaddons.command.automessage.create:
    description: Darf Automessages erstellen
    default: op
  ethriaaddons.command.automessage.editor:
    description: Darf den Automessage-Editor öffnen
    default: op
  ethriaaddons.command.automessage.view:
    description: Darf Automessages im Chat anzeigen lassen
    default: op
  ethriaaddons.command.automessage.reload:
    description: Darf die Automessage-Konfiguration neu laden
    default: op
  ethriaaddons.command.automessage.delete:
    description: Darf Automessages löschen
    default: op
  ethriaaddons.command.automessage.config:
    description: Darf Automessage-Einstellungen ändern
    default: op
  ethriaaddons.command.automessage.debug:
    description: Darf Automessage-Debuginformationen anzeigen
    default: op
  ethriaaddons.command.ethriaaddon.*:
    default: false
    children:
      ethriaaddons.command.ethriaaddon.reload: true
  ethriaaddons.command.ethriaaddon.reload:
    description: Darf Konfiguration und Sprache neu laden
    default: false

  ethriaaddons.command.locatebiome.*:
    default: false
    children:
      ethriaaddons.command.locatebiome.use: true

  ethriaaddons.command.locatebiome.use:
    description: Darf /locatebiome nutzen
    default: false

  ethriaaddons.command.holopanel.*:
    default: false
    children:
      ethriaaddons.command.holopanel.create: true
      ethriaaddons.command.holopanel.editor: true
      ethriaaddons.command.holopanel.reload: true
      ethriaaddons.command.holopanel.set: true
      ethriaaddons.command.holopanel.remove: true
      ethriaaddons.command.holopanel.delete: true
      ethriaaddons.command.holopanel.servername: true
  ethriaaddons.command.holopanel.create:
    description: Darf HoloPanels erstellen
    default: false
  ethriaaddons.command.holopanel.editor:
    description: Darf HoloPanels bearbeiten und verwalten
    default: false
  ethriaaddons.command.holopanel.reload:
    description: Lädt die gespeicherten HoloPanels neu
    default: false
  ethriaaddons.command.holopanel.set:
    description: Darf das HoloPanel-Setztool erhalten
    default: false
  ethriaaddons.command.holopanel.remove:
    description: Darf das HoloPanel-Entferntool erhalten
    default: false
  ethriaaddons.command.holopanel.delete:
    description: Darf HoloPanels löschen
    default: false
  ethriaaddons.command.holopanel.servername:
    description: Zeigt den von LuckPerms erkannten Servernamen
    default: false

  ethriaaddons.command.dragoneggcutter.*:
    default: false
    children:
      ethriaaddons.command.dragoneggcutter.give: true
  ethriaaddons.command.dragoneggcutter.give:
    description: Darf Dragon-Egg-Schneider ausgeben
    default: false

commands:
  ethriaaddon:
    description: Lädt Konfiguration und Sprachdatei neu
    usage: /ethriaaddon reload
  locatebiome:
    description: Findet das nächste Biom des angegebenen Typs
  holopanel:
    description: Erstellt und verwaltet HoloPanels
  automessage:
    description: Erstellt und verwaltet Automessages
  dragoneggcutter:
    description: Gibt Dragon-Egg-Schneider und konfigurierte Items aus
    usage: /dragoneggcutter give <Spieler> <Config-Name> [Anzahl]
