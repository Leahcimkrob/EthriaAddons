# GUI layout and button appearance. Slots are zero-based Bukkit inventory slots.
# Button types: material, player-head, minecart.
# item-id is a numeric CustomModelData value applied to the configured material.

# HeadDatabase head example: https://minecraft-heads.com/custom-heads/heads-database
#   material: PLAYER_HEAD
#   head-database-id: "xxxxx" (e.g. "75167")
#   fallback-material: REDSTONE
# Custom model example:
# button:
#   back:
#     slot: 49
#     material: PAPER
#     item-id: 4300208
#     fallback-material: ARROW
overview:
  rows: 6
  layout:
    # Each message item has a matching status slot beneath it. Keep both lists aligned by index.
    message-slots: [0, 1, 2, 3, 4, 5, 6, 7, 8, 18, 19, 20, 21, 22, 23, 24, 25, 26]
    status-slots: [9, 10, 11, 12, 13, 14, 15, 16, 17, 27, 28, 29, 30, 31, 32, 33, 34, 35]
  status:
    # Status item is shown directly below each message item.
    on:
      type: material
      material: GREEN_DYE
      head-database-id: ''
      item-id: ''
      fallback-material: GREEN_DYE
    off:
      type: material
      material: RED_DYE
      head-database-id: ''
      item-id: ''
      fallback-material: RED_DYE

config:
  interval-slot: 11
  view-slot: 15
  default-text-slot: 13
  default-text-width: 300
  default-text-height: 120
  rows: 4

button:
  previous:
    slot: 45
    material: PLAYER_HEAD
    head-database-id: '94736'
    fallback-material: ARROW
    item-id: ''
  back:
    slot: 49
    material: PLAYER_HEAD
    head-database-id: '94681'
    fallback-material: ARROW
    item-id: ''
  close:
    slot: 49
    material: PLAYER_HEAD
    head-database-id: '34744'
    fallback-material: BARRIER
    item-id: ''
  next-page:
    slot: 53
    material: PLAYER_HEAD
    head-database-id: '94735'
    fallback-material: ARROW
    item-id: ''

detail:
  rows: 4
  button:
    item:
      slot: 10
      type: material
      material: CHEST
      head-database-id: ''
      item-id: ''
      fallback-material: CHEST
    edit:
      slot: 13
      type: material
      material: CRAFTING_TABLE
      head-database-id: ''
      item-id: ''
      fallback-material: CRAFTING_TABLE
    delete:
      slot: 16
      type: material
      head-database-id: ''
      item-id: ''
      fallback-material: BARRIER
    servers:
      slot: 22
      type: material
      material: COMPASS
      head-database-id: ''
      item-id: ''
      fallback-material: COMPASS

servers:
  rows: 4
  on:
    type: material
    material: LIME_DYE
    head-database-id: ''
    item-id: ''
    fallback-material: LIME_DYE
  off:
    type: material
    material: GRAY_DYE
    head-database-id: ''
    item-id: ''
    fallback-material: GRAY_DYE

# Detail and item-change use Back in the last row; the overview uses Close.
# item-slot is zero-based and must be in the rows above the button bar.
item-change:
  rows: 4
  item-slot: 13
  filler-material: RED_STAINED_GLASS_PANE

filler:
  type: material
  material: GRAY_STAINED_GLASS_PANE
# Height of the multiline description field in the text editor (1-512 pixels).
text-editor:
  name-width: 300
  message-width: 300
  message-height: 120
